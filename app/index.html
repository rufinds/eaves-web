<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Get Eaves</title>
  <meta name="robots" content="noindex" />
  <style>
    :root {
      --bg: #020202;
      --primary: #E8000D;
      --text: #F5F5F5;
      --muted: #9A9A9A;
    }
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .wrap {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px 24px;
    }
    .logo {
      width: 88px;
      height: 88px;
      border-radius: 20px;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 22px;
      margin: 0 0 8px;
    }
    p {
      color: var(--muted);
      font-size: 15px;
      margin: 0 0 28px;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid #2a2a2a;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 28px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .fallback {
      display: none;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 320px;
    }
    .fallback.visible { display: flex; }
    .btn {
      display: block;
      padding: 14px 20px;
      border-radius: 12px;
      background: var(--primary);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
    }
    .btn.secondary {
      background: transparent;
      border: 1px solid #333;
      color: var(--text);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="/assets/icon.png" alt="Eaves" />
    <div class="spinner" id="spinner"></div>
    <h1>Opening Eaves…</h1>
    <p>You're being redirected to the right store.</p>

    <!-- Shown if automatic redirect doesn't fire (desktop, or blocked popup) -->
    <div class="fallback" id="fallback">
      <a class="btn" id="androidLink" href="https://play.google.com/store/apps/details?id=com.eaves.app">
        Download on Google Play
      </a>
      <a class="btn secondary" id="iosLink" href="https://apps.apple.com/app/id6794866218">
        Download on the App Store
      </a>
      <a class="btn secondary" href="https://eaves.be">Go to website</a>
    </div>
  </div>

  <script>
    // Store URLs — update PLAY_URL's package id or APP_STORE_URL's numeric id if they ever change.
    var PLAY_URL = 'https://play.google.com/store/apps/details?id=com.eaves.app';
    var APP_STORE_URL = 'https://apps.apple.com/app/id6794866218';

    var ua = navigator.userAgent || navigator.vendor || window.opera;
    var isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
    var isAndroid = /Android/.test(ua);

    // Reflect the detected platform in the fallback buttons too, in case redirect fails.
    document.getElementById('androidLink').href = PLAY_URL;
    document.getElementById('iosLink').href = APP_STORE_URL;

    if (isIOS) {
      window.location.replace(APP_STORE_URL);
    } else if (isAndroid) {
      window.location.replace(PLAY_URL);
    } else {
      // Desktop or unrecognized device — show both options instead of guessing.
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('fallback').classList.add('visible');
    }

    // Safety net: if the redirect is blocked or slow, reveal the fallback buttons after 2.5s.
    setTimeout(function () {
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('fallback').classList.add('visible');
    }, 2500);
  </script>
</body>
</html>
