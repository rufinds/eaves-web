<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Get Eaves</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#121212">
<link rel="icon" type="image/png" href="/assets/icon.png">
<link rel="apple-touch-icon" href="/assets/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#121212; --red:#C4000A; --text:#F7F5F2; --muted:#CBC7C1; --line:#3A3A3E; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text);
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; }
  a:focus-visible { outline: 3px solid #E8000E; outline-offset: 3px; border-radius: 4px; }
  .wrap { min-height: 100%; display: flex; flex-direction: column; align-items: center;
    justify-content: center; text-align: center; padding: 32px 24px;
    background: radial-gradient(ellipse 60% 45% at 50% 0%, rgba(200,0,10,.3), transparent 70%); }
  .logo { width: 96px; height: 96px; border-radius: 22px; margin-bottom: 24px; }
  h1 { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; text-transform: uppercase;
    font-size: 44px; line-height: 1; margin: 0 0 12px; }
  p { color: var(--muted); font-size: 16px; margin: 0 0 28px; }
  .spinner { width: 28px; height: 28px; border: 3px solid var(--line); border-top-color: var(--red);
    border-radius: 50%; animation: spin .8s linear infinite; margin-bottom: 24px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .fallback { display: none; flex-direction: column; gap: 12px; width: 100%; max-width: 320px; }
  .fallback.visible { display: flex; }
  .btn { display: block; padding: 15px 20px; border-radius: 12px; background: var(--red); color: #fff;
    text-decoration: none; font-weight: 600; font-size: 16px; }
  .btn:hover { background: #E40008; }
  .btn.secondary { background: transparent; border: 1px solid var(--line); color: var(--text); }
  .btn.secondary:hover { border-color: var(--muted); }
  @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
</style>
<noscript><style>.fallback{display:flex}.spinner,.status{display:none}</style></noscript>
<!-- analytics -->
<script defer data-domain="eaves.be" src="https://plausible.io/js/script.js"></script>
<script defer src="/assets/analytics.js?v=1"></script>
<!-- /analytics -->
</head>
<body>
  <div class="wrap">
    <img class="logo" src="/assets/icon.png" alt="Eaves" width="96" height="96">
    <div class="spinner" id="spinner"></div>
    <h1 class="status">Opening Eaves…</h1>
    <p class="status">You’re being redirected to the right store.</p>

    <!-- Shown when the automatic redirect does not fire (desktop, or blocked) -->
    <div class="fallback" id="fallback">
      <a class="btn" id="androidLink" href="https://play.google.com/store/apps/details?id=com.eaves.app">Download on Google Play</a>
      <a class="btn secondary" id="iosLink" href="https://apps.apple.com/app/id6794866218">Download on the App Store</a>
      <a class="btn secondary" href="https://eaves.be">Go to website</a>
    </div>
  </div>

  <script>
    // Store URLs: update PLAY_URL's package id or APP_STORE_URL's numeric id if they ever change.
    var PLAY_URL = 'https://play.google.com/store/apps/details?id=com.eaves.app';
    var APP_STORE_URL = 'https://apps.apple.com/app/id6794866218';

    var ua = navigator.userAgent || navigator.vendor || window.opera;
    var isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
    var isAndroid = /Android/.test(ua);

    // Keep the fallback buttons in sync with the store URLs above.
    document.getElementById('androidLink').href = PLAY_URL;
    document.getElementById('iosLink').href = APP_STORE_URL;

    // Count the redirect and where the visitor came from, then continue shortly
    // after so the analytics request can leave first.
    function go(url, os) {
      var from = new URLSearchParams(window.location.search).get('from') || 'direct';
      try {
        if (typeof window.plausible === 'function') {
          window.plausible('App redirect ' + os, { props: { from: from } });
        } else if (window.umami && typeof window.umami.track === 'function') {
          window.umami.track('App redirect ' + os, { from: from });
        }
      } catch (e) { /* never block the redirect */ }
      setTimeout(function () { window.location.replace(url); }, 300);
    }

    // Wait for the page (and the analytics script) to load before redirecting.
    window.addEventListener('load', function () {
      if (isIOS) {
        go(APP_STORE_URL, 'ios');
      } else if (isAndroid) {
        go(PLAY_URL, 'android');
      } else {
        // Desktop or unrecognized device: show both options instead of guessing.
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('fallback').classList.add('visible');
      }
    });

    // Safety net: reveal the fallback buttons after 2.5s if the redirect is blocked or slow.
    setTimeout(function () {
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('fallback').classList.add('visible');
    }, 2500);
  </script>
</body>
</html>
