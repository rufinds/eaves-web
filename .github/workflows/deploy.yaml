name: Deploy site

on:
  push:
    branches: [main]
  schedule:
    # Hourly refresh so new and expired events show up without a manual deploy.
    - cron: '7 * * * *'
  # Fired by the database when a public event is created or changes.
  repository_dispatch:
    types: [events-changed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # sharp, satori and the card fonts are only needed at build time.
      - name: Install dependencies
        run: npm ci

      - name: Assemble static files
        run: |
          mkdir _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' --exclude='_site_test' --exclude='scripts' --exclude='screens' --exclude='node_modules' --exclude='package.json' --exclude='package-lock.json' --exclude='.gitignore' ./ _site/

      - name: Generate event pages and images
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          OUT_DIR: _site
        run: node scripts/build-events.mjs

      - name: Verify events marker was replaced
        run: |
          if grep -q '<!--EVENTS-->' _site/index.html; then
            echo "Events marker still present in index.html" >&2
            exit 1
          fi

      # A single failed image only costs that event its preview, so this only
      # warns; build-events.mjs already fails when every image fails.
      - name: Verify event images
        run: |
          pages=$(find _site/event -name index.html 2>/dev/null | wc -l)
          images=$(find _site/event -name og.jpg 2>/dev/null | wc -l)
          echo "event pages: $pages, preview images: $images"
          if [ "$pages" -gt 0 ] && [ "$images" -lt "$pages" ]; then
            echo "::warning::$((pages - images)) event page(s) have no generated preview image"
          fi

      # Universal links break silently when these files are missing.
      - name: Verify required files
        run: |
          test -f _site/.well-known/apple-app-site-association
          test -f _site/.well-known/assetlinks.json
          test -f _site/CNAME
          test -f _site/404.html

      # Hidden directories such as .well-known are dropped from the artifact
      # unless include-hidden-files is set.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Check that universal link files are served
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS https://eaves.be/.well-known/assetlinks.json > /dev/null \
              && curl -fsS https://eaves.be/.well-known/apple-app-site-association > /dev/null; then
              echo "Universal link files are served."
              exit 0
            fi
            sleep 10
          done
          echo "Universal link files are not served from eaves.be/.well-known" >&2
          exit 1