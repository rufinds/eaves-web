<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eaves</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#121212">
<link rel="icon" type="image/png" href="/assets/icon.png">
<link rel="apple-touch-icon" href="/assets/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:         #121212;
    --bg-raised:  #1A1A1A;
    --red:        #8B0000;
    --red-bright: #B8291F;
    --text:       #F2F0ED;
    --text-muted: #8A8A8A;
    --border:     #2A2A2A;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  a { color: inherit; }

  a:focus-visible, button:focus-visible {
    outline: 2px solid var(--red-bright);
    outline-offset: 3px;
    border-radius: 2px;
  }

  .wrap {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 24px;
    position: relative;
  }

  .wrap::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 60% 45% at 50% 0%, rgba(139,0,0,0.28), transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .wrap > * { position: relative; z-index: 1; }

  .logo {
    width: 88px;
    height: 88px;
    border-radius: 20px;
    margin-bottom: 24px;
  }

  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: clamp(22px, 5vw, 28px);
    letter-spacing: -0.01em;
    margin: 0 0 10px;
    max-width: 340px;
  }

  p.sub {
    color: var(--text-muted);
    font-size: 15px;
    line-height: 1.6;
    margin: 0 0 32px;
    max-width: 320px;
  }

  .cta-col {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    max-width: 300px;
  }

  .btn {
    display: block;
    padding: 14px 20px;
    border-radius: 12px;
    background: var(--red-bright);
    color: #fff;
    text-decoration: none;
    font-weight: 600;
    font-size: 15px;
    transition: background 0.15s ease;
  }

  .btn:hover { background: #d13a2f; }

  .btn.secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
  }

  .btn.secondary:hover { border-color: var(--text-muted); }

  .hint {
    margin-top: 28px;
    font-size: 12px;
    color: var(--text-muted);
    max-width: 280px;
    line-height: 1.6;
  }

  .hint strong { color: var(--text); font-weight: 600; }
</style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="/assets/icon.png" alt="Eaves">
    <h1 id="heading">Open this in the Eaves app</h1>
    <p class="sub" id="subtext">This link only works inside the Eaves app.</p>

    <div class="cta-col">
      <a class="btn" id="openAppBtn" href="#">Open in Eaves</a>
      <a class="btn secondary" id="storeBtn" href="https://eaves.be/app">Download Eaves</a>
      <a class="btn secondary" href="https://eaves.be">Go to eaves.be</a>
    </div>

    <p class="hint" id="installHint">
      Don't have the app yet? <strong>Install it, then tap this link again</strong> — it'll still work.
    </p>
  </div>

  <script>
    // GitHub Pages serves this file for any unmatched path while keeping
    // the original URL in the address bar — so window.location.pathname
    // still reflects the deep link the person actually tapped (e.g.
    // /artist/directory/<id>/<token>). A universal link that DID resolve
    // to the installed app never reaches this page at all — the OS
    // intercepts it before any network request happens. So landing here
    // always means "app not installed, or the OS didn't hand off this
    // particular tap" — never a broken working link.
    var path = window.location.pathname;

    // Custom-scheme fallback: works even when the OS declined to treat
    // this tap as a universal link (typed in the address bar, opened from
    // a page on the same domain, or tapped inside some in-app browsers
    // that strip https universal-link handling but still honour custom
    // schemes). Harmless no-op if the app truly isn't installed.
    var customSchemeUrl = 'eaves:/' + path + window.location.search;
    document.getElementById('openAppBtn').href = customSchemeUrl;

    // Claim-link-specific copy — same idea applies to any future
    // personal-link pattern, extend this regex as needed.
    var claimMatch = path.match(/^\/(artist|organizer)\/directory\//);
    if (claimMatch) {
      var kind = claimMatch[1] === 'artist' ? 'artist' : 'organizer';
      document.getElementById('heading').textContent = 'Is this your profile?';
      document.getElementById('subtext').textContent =
        'Open this link in the Eaves app to claim your ' + kind + ' profile.';
    }

    var ua = navigator.userAgent || navigator.vendor || window.opera;
    var isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
    var isAndroid = /Android/.test(ua);

    if (isIOS) {
      document.getElementById('storeBtn').href = 'https://apps.apple.com/app/id6794866218';
      document.getElementById('storeBtn').textContent = 'Download on the App Store';
    } else if (isAndroid) {
      document.getElementById('storeBtn').href = 'https://play.google.com/store/apps/details?id=com.eaves.app';
      document.getElementById('storeBtn').textContent = 'Get it on Google Play';
    } else {
      // Desktop — no store to redirect to, hide the "already have it"
      // primary CTA since Open-in-app is meaningless without a phone.
      document.getElementById('openAppBtn').style.display = 'none';
      document.getElementById('installHint').style.display = 'none';
    }
  </script>
</body>
</html>
