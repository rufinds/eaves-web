<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eaves</title>
<meta name="robots" content="noindex">
<!-- The path of this page contains a personal claim token: never leak it via the Referer header. -->
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#121212">
<link rel="icon" type="image/png" href="/assets/icon.png">
<link rel="apple-touch-icon" href="/assets/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:         #121212;
    --red-bright: #B8291F;
    --text:       #F2F0ED;
    --text-muted: #8A8A8A;
  }

  * { box-sizing: border-box; }

  [hidden] { display: none !important; }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  a:focus-visible {
    outline: 2px solid var(--red-bright);
    outline-offset: 3px;
    border-radius: 2px;
  }

  .wrap {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 24px;
    position: relative;
  }

  .wrap::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 60% 45% at 50% 0%, rgba(139,0,0,0.28), transparent 70%);
    pointer-events: none;
  }

  .wrap > * { position: relative; }

  .logo {
    width: 96px;
    height: 96px;
    border-radius: 22px;
    margin-bottom: 28px;
  }

  /* A real profile photo replaces the logo and is round. */
  .logo.photo {
    border-radius: 50%;
    object-fit: cover;
  }

  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: clamp(26px, 7vw, 32px);
    letter-spacing: -0.01em;
    line-height: 1.2;
    margin: 0 0 28px;
    max-width: 340px;
    overflow-wrap: anywhere;
  }

  .note {
    color: var(--text-muted);
    font-size: 15px;
    line-height: 1.6;
    margin: -12px 0 28px;
    max-width: 300px;
  }

  .note.small {
    font-size: 13px;
    margin: 20px 0 0;
  }

  .cta {
    width: 100%;
    max-width: 300px;
  }

  .btn {
    display: block;
    padding: 16px 20px;
    border-radius: 14px;
    background: var(--red-bright);
    color: #fff;
    text-decoration: none;
    font-weight: 600;
    font-size: 17px;
    transition: background 0.15s ease;
  }

  .btn:hover { background: #d13a2f; }
</style>
</head>
<body>
  <main class="wrap">
    <img class="logo" id="logo" src="/assets/icon.png" alt="Eaves">
    <h1 id="heading">Claim your profile</h1>
    <p class="note" id="note" hidden></p>
    <div class="cta">
      <a class="btn" id="claimBtn" href="#">Claim profile</a>
      <a class="btn" id="installBtn" href="https://eaves.be/app" hidden>Download Eaves</a>
    </div>
    <p class="note small" id="inAppNote" hidden></p>
  </main>

  <script>
    (function () {
      // ── Configuration ──────────────────────────────────────────────────────
      var APP_SCHEME      = 'eaves';
      var ANDROID_PACKAGE = 'com.eaves.app';
      var PLAY_URL        = 'https://play.google.com/store/apps/details?id=' + ANDROID_PACKAGE;
      var APP_STORE_URL   = 'https://apps.apple.com/app/id6794866218';

      // Set to true once the native build that reads the Google Play install
      // referrer has been released. Until then the claim token would only be
      // sent to the Play Store without anything consuming it.
      var ANDROID_INSTALL_REFERRER = false;

      // Shows the name (and photo, when there is one) of the profile being
      // claimed, e.g. "Claim Kingstep Sound". Uses the project URL and the
      // PUBLIC anon key — the same key that ships inside the app — and only
      // requests name/image/claimed status. Set to null to keep the page
      // fully static.
      var PROFILE_PREVIEW = {
        url: 'https://pxrgheclywxmpbnclngh.supabase.co',
        anonKey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB4cmdoZWNseXd4bXBibmNsbmdoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDM1MzU0ODksImV4cCI6MjA1OTExMTQ4OX0.XrBKNBpQgWz9JT-cUPcKUcdyvHa8ovpUbcPhuQ_n78M'
      };

      // ── Copy ───────────────────────────────────────────────────────────────
      var STRINGS = {
        en: {
          claimGeneric: 'Claim your profile',
          claimNamed: 'Claim {name}',
          claimBtn: 'Claim profile',
          openGeneric: 'Open in the Eaves app',
          openBtn: 'Open Eaves',
          playStore: 'Get it on Google Play',
          appStore: 'Download on the App Store',
          getApp: 'Download Eaves',
          notInstalled: 'Eaves isn\u2019t installed yet. Install the app, then tap your link again.',
          inAppNote: 'Already installed? Open this page in your browser (\u22EE or \u22EF menu).',
          desktop: 'Open this link on your phone.',
          claimed: 'This profile has already been claimed.',
          claimedHelp: 'Questions? Email help@eaves.be.'
        },
        nl: {
          claimGeneric: 'Claim je profiel',
          claimNamed: 'Claim {name}',
          claimBtn: 'Claim profiel',
          openGeneric: 'Open in de Eaves-app',
          openBtn: 'Open Eaves',
          playStore: 'Download via Google Play',
          appStore: 'Download in de App Store',
          getApp: 'Download Eaves',
          notInstalled: 'Eaves is nog niet ge\u00EFnstalleerd. Installeer de app en tik daarna opnieuw op je link.',
          inAppNote: 'Al ge\u00EFnstalleerd? Open deze pagina in je browser (\u22EE of \u22EF menu).',
          desktop: 'Open deze link op je telefoon.',
          claimed: 'Dit profiel is al geclaimd.',
          claimedHelp: 'Vragen? Mail help@eaves.be.'
        }
      };

      var browserLang = ((navigator.languages && navigator.languages[0]) || navigator.language || 'en').toLowerCase();
      var lang = browserLang.indexOf('nl') === 0 ? 'nl' : 'en';
      var t = STRINGS[lang];
      document.documentElement.lang = lang;

      // ── Environment ────────────────────────────────────────────────────────
      var ua = navigator.userAgent || navigator.vendor || window.opera || '';
      var isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
      var isAndroid = /Android/.test(ua);
      var isMobile = isIOS || isAndroid;
      // In-app browsers (Messenger, Instagram, Facebook, ...) often block the
      // hand-over to an installed app, so "not opened" is not proof that the
      // app is missing there.
      var isInAppBrowser = /FBAN|FBAV|FB_IAB|Messenger|Instagram|Snapchat|TikTok|musical_ly|LinkedInApp|Line\//i.test(ua);

      // ── Deep link ──────────────────────────────────────────────────────────
      // GitHub Pages serves this file for any unmatched path while keeping the
      // original URL, so the path is the deep link the person tapped. A
      // universal link that DID resolve to the installed app never reaches this
      // page at all.
      var path = window.location.pathname;
      var search = window.location.search;
      var deepPath = path.replace(/^\/+/, '') + search;

      var UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
      var claimMatch = path.match(/^\/(artist|organizer)\/directory\/([^/]+)\/([^/]+)\/?$/);
      var claimKind = claimMatch ? claimMatch[1] : null;
      var claimId = claimMatch ? claimMatch[2] : null;

      function androidStoreUrl() {
        if (!ANDROID_INSTALL_REFERRER || !claimMatch) return PLAY_URL;
        // The referrer value is itself a URL-encoded query string.
        return PLAY_URL + '&referrer=' + encodeURIComponent('claim=' + encodeURIComponent(path));
      }

      // Android: an intent URL opens the app when it is installed. When it is
      // not, the browser navigates to the fallback — this same page with
      // #install, which switches the page to its "install first" state.
      function androidIntentUrl() {
        var fallback = window.location.origin + path + search + '#install';
        return 'intent://' + deepPath +
          '#Intent;scheme=' + APP_SCHEME +
          ';package=' + ANDROID_PACKAGE +
          ';S.browser_fallback_url=' + encodeURIComponent(fallback) +
          ';end';
      }

      var customSchemeUrl = APP_SCHEME + '://' + deepPath;

      // ── Elements ───────────────────────────────────────────────────────────
      var el = function (id) { return document.getElementById(id); };
      var logo = el('logo');
      var heading = el('heading');
      var note = el('note');
      var inAppNote = el('inAppNote');
      var claimBtn = el('claimBtn');
      var installBtn = el('installBtn');

      // ── State ──────────────────────────────────────────────────────────────
      // 'ready'   : one button — claim / open the app
      // 'install' : the app did not open — warn once, then send to the store
      // 'desktop' : no phone — only a download button
      // 'claimed' : profile already taken — message only
      var state = 'ready';
      var leftPage = false;

      function render() {
        var install = state === 'install';
        claimBtn.hidden = state !== 'ready';
        installBtn.hidden = !(install || state === 'desktop');
        note.hidden = !(install || state === 'desktop' || state === 'claimed');
        inAppNote.hidden = !(install && isInAppBrowser);

        if (install) note.textContent = t.notInstalled;
        if (state === 'desktop') note.textContent = t.desktop;
        if (state === 'claimed') note.textContent = t.claimedHelp;
      }

      function setState(next) {
        if (state === 'claimed' || state === 'desktop' || state === next) return;
        state = next;
        render();
      }

      // ── Text and links ─────────────────────────────────────────────────────
      heading.textContent = claimMatch ? t.claimGeneric : t.openGeneric;
      claimBtn.textContent = claimMatch ? t.claimBtn : t.openBtn;
      inAppNote.textContent = t.inAppNote;

      if (isAndroid) {
        claimBtn.href = androidIntentUrl();
        installBtn.href = androidStoreUrl();
        installBtn.textContent = t.playStore;
      } else if (isIOS) {
        claimBtn.href = customSchemeUrl;
        installBtn.href = APP_STORE_URL;
        installBtn.textContent = t.appStore;
      } else {
        installBtn.href = 'https://eaves.be/app';
        installBtn.textContent = t.getApp;
        state = 'desktop';
      }
      render();

      // ── "The app did not open" detection ───────────────────────────────────
      // When the app opens, the page is hidden. If it is still visible a moment
      // after the tap, the app is most likely not installed. iOS gets longer
      // because Safari first asks "Open in Eaves?".
      var notOpenedTimer = null;

      function cancelTimer() {
        if (notOpenedTimer) { clearTimeout(notOpenedTimer); notOpenedTimer = null; }
      }

      claimBtn.addEventListener('click', function () {
        cancelTimer();
        notOpenedTimer = setTimeout(function () {
          if (!document.hidden) setState('install');
        }, isIOS ? 2500 : 1800);
      });

      document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
          cancelTimer();
          if (state === 'install') leftPage = true;
        } else if (state === 'install' && leftPage) {
          // Back from the store (or from a dialog): offer the claim button again.
          leftPage = false;
          setState('ready');
          if (window.location.hash === '#install') {
            history.replaceState(null, '', path + search);
          }
        }
      });
      window.addEventListener('pagehide', cancelTimer);

      // Android fallback from the intent URL lands here with #install.
      function checkHash() {
        if (window.location.hash === '#install') setState('install');
      }
      window.addEventListener('hashchange', checkHash);
      checkHash();

      // ── Profile name and photo ─────────────────────────────────────────────
      if (PROFILE_PREVIEW && claimMatch && UUID_RE.test(claimId)) {
        var table = claimKind === 'artist' ? 'artist_directory_profiles' : 'organizer_directory_profiles';
        var nameColumn = claimKind === 'artist' ? 'name' : 'organization_name';
        var query = '/rest/v1/' + table +
          '?id=eq.' + encodeURIComponent(claimId) +
          '&select=' + nameColumn + ',image_url,claimed_by_user_id';

        var headers = { apikey: PROFILE_PREVIEW.anonKey };
        // Legacy anon keys are JWTs and may double as bearer token; the newer
        // sb_publishable_ keys are not JWTs and must only go in apikey.
        if (PROFILE_PREVIEW.anonKey.indexOf('eyJ') === 0) {
          headers.Authorization = 'Bearer ' + PROFILE_PREVIEW.anonKey;
        }

        fetch(PROFILE_PREVIEW.url + query, { headers: headers })
          .then(function (response) { return response.ok ? response.json() : []; })
          .then(function (rows) {
            var row = rows && rows[0];
            if (!row) return;

            // Many curated profiles have no photo; the name in the heading is
            // the main element, the photo is a bonus.
            if (typeof row.image_url === 'string' && /^https:\/\//.test(row.image_url)) {
              logo.src = row.image_url;
              logo.className = 'logo photo';
            }

            if (row.claimed_by_user_id) {
              // Already taken: message only, no button.
              state = 'claimed';
              heading.textContent = t.claimed;
              render();
            } else if (row[nameColumn]) {
              // textContent only — the name is data, never markup.
              heading.textContent = t.claimNamed.replace('{name}', row[nameColumn]);
            }
          })
          .catch(function () { /* the page works without the preview */ });
      }
    })();
  </script>
</body>
</html>
