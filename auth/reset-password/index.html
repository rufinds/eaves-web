<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wachtwoord resetten — Eaves</title>
<meta name="robots" content="noindex">
<!-- The URL contains a recovery token: never leak it via the Referer header. -->
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#121212">
<link rel="icon" type="image/png" href="/assets/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#121212; --red:#C8281C; --text:#F7F5F2; --muted:#CBC7C1; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 48px 20px; background: var(--bg); color: var(--text); text-align: center;
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; line-height: 1.6;
    background-image: radial-gradient(ellipse 60% 40% at 50% 0%, rgba(200,40,28,.3), transparent 70%);
    background-repeat: no-repeat; }
  .container { max-width: 420px; margin: auto; }
  .logo { width: 80px; height: 80px; border-radius: 18px; margin: 0 auto 20px; }
  h1 { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; text-transform: uppercase;
    font-size: 42px; line-height: 1; margin: 0 0 16px; }
  p { color: var(--muted); }
  .button { display: inline-block; background: var(--red); color: #fff; padding: 15px 28px;
    text-decoration: none; border-radius: 12px; font-weight: 600; margin-top: 12px; }
  .button:hover { background: #DD3226; }
  .button:focus-visible { outline: 3px solid #F0463A; outline-offset: 3px; }
  .hint { font-size: 14px; margin-top: 32px; }
</style>
</head>
<body>
  <div class="container">
    <img class="logo" src="/assets/icon.png" alt="Eaves" width="80" height="80">
    <h1>Wachtwoord resetten</h1>
    <p id="status">Je wordt doorgestuurd naar de Eaves-app…</p>
    <a id="fallback-link" class="button" href="#">Open Eaves</a>
    <p class="hint">
      Als er niets gebeurt: zorg dat de Eaves-app geïnstalleerd is en tik dan op de knop hierboven.
      Werkt het nog steeds niet? Vraag een nieuwe resetlink aan in de app.
    </p>
  </div>

  <script>
    // Fallback for the /auth/reset-password universal link. When AASA/assetlinks
    // verification succeeds on the device, the OS intercepts the URL before it
    // reaches this server and this page is never shown. It only renders when
    // that interception does not happen (app not installed yet, desktop
    // browser, verification not yet propagated on that device). It forwards the
    // query params to the eaves:// custom scheme as a manual fallback.
    const params = new URLSearchParams(window.location.search);
    const tokenHash = params.get('token_hash');
    const type = params.get('type') || 'recovery';

    if (tokenHash) {
      const appUrl = `eaves://auth/reset-password?token_hash=${encodeURIComponent(tokenHash)}&type=${encodeURIComponent(type)}`;
      document.getElementById('fallback-link').href = appUrl;
      window.location.href = appUrl;
    } else {
      document.getElementById('status').textContent =
        'Deze link is ongeldig of onvolledig. Vraag een nieuwe resetlink aan in de app.';
      document.getElementById('fallback-link').style.display = 'none';
    }
  </script>
</body>
</html>
